[package]
name = "dsh-eac-tauri-shell"
version = "0.1.0"
description = "Deepseek Harness EAC — Tauri ShellHost PoC (ADR 0002 L1)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "dsh-eac-shell"
path = "src/main.rs"

[profile.dev]
incremental = true
