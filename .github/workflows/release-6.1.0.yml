name: Release 6.1.0

# 6.1.0 发行构建（手动触发）。
#
# 为什么不是 tag 触发：本轮要先验证「压缩优化 + 双档位装配」是否真的可行，
# 不能一上来就绑死 tag —— 打错 tag 再修，代价比手动跑一轮大得多。
# 验证通过后再把 `push: tags` 打开（见文件末尾注释）。
#
# 只做 lite：lite 不含 Pack 预置层，不受 EAC-Pack 仓库 11 个未合并 PR 的影响。
# full 的 Pack 来源待定（见 PR 讨论），所以这里显式只跑 lite，不做假承诺。
#
# 与 staged-runtime-artifact.yml 的关系：那个是 4 平台矩阵（含 arm64/linux），
# 且硬编码 --distro 缺省 lite + 只上传 EAC-Lite-*。本文件是 6.1.0 专用的
# Windows x64 发行通道，两者并存互不影响。

on:
  workflow_dispatch:
    inputs:
      distro:
        description: '档位（full 暂未接入 Pack 预置层，先只支持 lite）'
        required: true
        default: lite
        type: choice
        options:
          - lite
      skip_tests:
        description: '跳过单元测试（仅供排障，正式发行不要勾）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.7.0'
  KERNEL_VERSION: '0.2.0-rc.2'

jobs:
  release:
    name: 构建 6.1.0 ${{ inputs.distro }}（windows/x64）
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: dsh-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 打包必须携带固定提交的 dsh-dpx JS API（ADR 0004）。
          submodules: recursive

      - name: Verify dsh-dpx submodule pin
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/check-dpx-pin.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: Install pinned pnpm
        run: npm install --global pnpm@${{ env.PNPM_VERSION }} && pnpm --version

      - name: Cache vendored kernel
        uses: actions/cache@v4
        with:
          path: dsh-desktop/vendor/kernel
          key: ${{ runner.os }}-${{ env.KERNEL_VERSION }}-kernel-${{ hashFiles('dsh-desktop/scripts/fetch-kernel.ts') }}

      - name: Prepare vendored kernel
        run: node scripts/fetch-kernel.js

      - name: Install dependencies
        run: npm run ci:install

      - name: Fetch bundled Node and npm runtimes
        run: npm run fetch-runtime

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Cargo dependencies
        working-directory: ${{ github.workspace }}/tauri-shell
        run: cargo fetch --locked

      - name: Unit tests
        if: ${{ !inputs.skip_tests }}
        run: npm test

      - name: Assemble staged runtime (${{ inputs.distro }})
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/stage-resources.mjs --target=win32 --distro=${{ inputs.distro }} --skip-npm

      - name: Verify staged closure and bundle integrity
        working-directory: ${{ github.workspace }}
        run: node dsh-desktop/scripts/verify-staged-runtime.mjs

      # 可复现构建：v6.0.1 实测发现壳 exe 会嵌入本机构建路径，
      # 用 remap 去掉，避免把 runner 的目录结构（含用户名）带进发行版。
      - name: Build Tauri installers
        working-directory: ${{ github.workspace }}/tauri-shell
        env:
          CARGO_ENCODED_RUSTFLAGS: '--remap-path-prefix=${{ github.workspace }}=eac-build'
        run: npx -y @tauri-apps/cli@2 build --verbose

      - name: Build portable package
        working-directory: ${{ github.workspace }}/tauri-shell
        run: node make-portable.mjs --out target/release/portable

      - name: Collect artifacts
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir -p out
          find tauri-shell/target/release/bundle -name '*.exe' -path '*nsis*' -exec cp {} out/ \;
          find tauri-shell/target/release/portable -name '*.zip' -exec cp {} out/ \;
          find tauri-shell/target/release/bundle -name 'SHA256SUMS*.txt' -exec cp {} out/ \; || true
          find tauri-shell/target/release/portable -name 'SHA256SUMS*.txt' -exec cp {} out/ \; || true
          ls -la out

      - name: Show artifact sizes
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          echo "=== 产物大小 ==="
          du -h out/* 2>/dev/null | sort -h

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eac-6.1.0-${{ inputs.distro }}-windows-x64
          path: ${{ github.workspace }}/out/*
          if-no-files-found: error
          retention-days: 30

# 验证通过后，把上面的 `workflow_dispatch` 扩成：
#
#   on:
#     workflow_dispatch: { ... }
#     push:
#       tags: ['v6.1.0*']
#
# 并增加一个 publish job（permissions: contents: write）用
# softprops/action-gh-release 或 gh release upload 发布。
# 在压缩优化与双档位都实测通过前不要打开 tag 触发。
