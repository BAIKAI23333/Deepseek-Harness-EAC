name: Release 6.1.0
on:
  push:
    branches:
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - 'reports/**'
      - 'docs/**'
concurrency:
  group: release-6.1.0-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  NODE_VERSION: '24'
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hello
        run: echo ok
