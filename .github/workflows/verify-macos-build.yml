# macOS (Apple Silicon arm64) 打包验证 —— 用于在 GitHub Actions 上验证
# PR #234（macos-port）的 darwin 打包链路能否真正跑通：
#   tauri-shell/stage-resources.mjs --target=darwin   （darwin 裁剪 + 装配，CI 上从未执行过）
#   tauri 2 build（.app + .dmg，tauri.macos.conf.json）
# 结构审计 + --bridge-test 打包态自检 + 启动冒烟。
#
# 本 workflow 只响应 workflow_dispatch，不挂在任何 push/PR 事件上；
# 驱动脚本为同目录 verify-pr234-macos.sh（取 PR head → 建临时分支 → 触发本 workflow → 轮询）。
# 若后续想把它转正为常驻 macOS CI，把 on 段改成 push/pull_request 即可。
name: verify-macos-build

on:
  workflow_dispatch:

concurrency:
  group: verify-macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: 验证 macOS arm64 打包（PR #234）
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链（stable → aarch64-apple-darwin）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 注册表与原生模块构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-desktop/native/supervisor/target
            dsh-desktop/native/snapshot/target
          key: dsh-cargo-darwin-arm64-${{ hashFiles('dsh-desktop/native/*/Cargo.lock') }}
          restore-keys: |
            dsh-cargo-darwin-arm64-

      - name: 安装依赖 + 获取 darwin runtime（vendor node）
        run: npm ci && npm run fetch-runtime

      - name: 类型检查（tsc --noEmit 零错误）
        run: npm run typecheck

      - name: 全量测试（darwin 首次 CI 验证，PR 声称 705 pass/8 skip）
        run: npm test

      - name: Rust 原生模块 clippy、测试与构建（supervisor + snapshot）
        run: |
          npm run clippy:native
          npm run clippy:native -- snapshot
          npm run test:native
          npm run test:native -- snapshot
          npm run build:native
          npm run build:native -- snapshot

      - name: 装配 darwin 资源树（stage-resources --target=darwin）
        working-directory: ${{ github.workspace }}
        run: node tauri-shell/stage-resources.mjs --target=darwin

      - name: 审计 staged 资源树（darwin 裁剪预期）
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -eu
          stash="tauri-shell/staged-resources"
          tree="$stash/dsh-desktop"
          # stage-resources 的 sidecar 产物在 staged-resources/sidecar/（与 dsh-desktop 平级）
          test -f "$stash/sidecar/server.js" || { echo "缺 $stash/sidecar/server.js"; exit 1; }
          test -f "$tree/vendor/node/node" && test -x "$tree/vendor/node/node" || { echo "vendor node 缺失或不可执行"; exit 1; }
          test -d "$tree/assets/plugins/computer-user" && { echo "computer-user 插件未被裁剪"; exit 1; }
          test -d "$tree/assets/plugins/dsh-dafeiyu" && { echo "dsh-dafeiyu 插件未被裁剪"; exit 1; }
          test -d "$tree/assets/agent-presets" && { echo "agent-presets 未被裁剪"; exit 1; }
          nwin=$(find "$tree" \( -name '*.exe' -o -name '*.dll' \) | wc -l | tr -d ' ')
          echo "Windows 二进制残留: $nwin"
          test "$nwin" -eq 0 || { echo "发现 *.exe/*.dll 残留"; exit 1; }
          pre="$tree/node_modules/node-pty/prebuilds"
          echo "node-pty prebuilds: $(find "$pre" -maxdepth 1 -type d -mindepth 1 -exec basename {} \; | tr '\n' ' ')"
          test -d "$pre/darwin-arm64" || { echo "缺 darwin-arm64 prebuild"; exit 1; }
          test "$(find "$pre" -maxdepth 1 -type d -mindepth 1 | wc -l | tr -d ' ')" -eq 1 || { echo "应只剩 darwin-arm64"; exit 1; }
          echo "== staged 资源树审计通过 =="

      - name: Tauri 构建（.app + .dmg，按 tauri.macos.conf.json）
        working-directory: tauri-shell
        run: npx -y @tauri-apps/cli@2 build --ci

      - name: 审计 .app bundle 结构与内容
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -eu
          APP="tauri-shell/target/release/bundle/macos/Deepseek Harness EAC.app"
          test -d "$APP" || { echo ".app 未生成"; exit 1; }
          test -f "$APP/Contents/MacOS/dsh-eac-shell" || { echo "main 二进制缺失"; exit 1; }
          test -f "$APP/Contents/Resources/sidecar/server.js" || { echo "Contents/Resources/sidecar/server.js 缺失"; exit 1; }
          test -d "$APP/Contents/Resources/dsh-desktop" || { echo "Contents/Resources/dsh-desktop 缺失"; exit 1; }
          # macOS dmg 由 tauri 放到 bundle/dmg/，文件名含版本与架构
          DMG="$(find tauri-shell/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$DMG" || { echo ".dmg 未生成"; exit 1; }
          echo "DMG: $DMG"
          ls -lh tauri-shell/target/release/bundle/macos/ tauri-shell/target/release/bundle/dmg/
          echo "== .app 结构审计通过 =="

      - name: --bridge-test 打包态自检（sidecar 解析应命中 Contents/Resources）
        working-directory: ${{ github.workspace }}
        run: |
          "${{ github.workspace }}/tauri-shell/target/release/bundle/macos/Deepseek Harness EAC.app/Contents/MacOS/dsh-eac-shell" --bridge-test

      - name: 启动冒烟（open .app → sidecar → Web 探活 → 优雅退出零残留）
        continue-on-error: true
        shell: bash
        run: |
          set -u
          APP="${{ github.workspace }}/tauri-shell/target/release/bundle/macos/Deepseek Harness EAC.app"
          open "$APP"
          echo "等待应用拉起..."
          for i in $(seq 1 30); do
            pgrep -fl "dsh-eac-shell" >/dev/null && { echo "shell 进程已出现 ($((i*2))s)"; break; }
            sleep 2
          done
          pgrep -fl "dsh-eac-shell" || { echo "WARN: shell 进程未出现"; exit 0; }
          sleep 8
          log="$HOME/Library/Application Support/deepseek-harness-eac/logs/dsh-web.log"
          echo "--- 日志尾部 ---"; tail -20 "$log" 2>/dev/null || echo "(无日志文件)"
          port=$(grep -o 'http://127.0.0.1:[0-9]*' "$log" 2>/dev/null | tail -1 | sed 's#http://127.0.0.1:##')
          if [ -n "${port:-}" ]; then
            curl -fsS --max-time 5 "http://127.0.0.1:$port" >/dev/null && echo "Web HTTP 200 ✅" || echo "WARN: HTTP 探活失败（端口 $port）"
          else
            echo "WARN: 日志中未找到 Web 端口"
          fi
          osascript -e 'quit app "Deepseek Harness EAC"' 2>/dev/null || kill "$(pgrep -f dsh-eac-shell | head -1)" 2>/dev/null || true
          sleep 6
          if pgrep -fl "dsh-eac-shell|sidecar/server.js" >/dev/null; then
            echo "WARN: 退出后仍有 EAC 残留进程"
            pgrep -fl "dsh-eac-shell|sidecar/server.js"
          else
            echo "优雅退出零残留 ✅"
          fi

      - name: 上传 macOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-macos-arm64-verify
          path: |
            tauri-shell/target/release/bundle/macos/
            tauri-shell/target/release/bundle/dmg/
          if-no-files-found: error
          retention-days: 7